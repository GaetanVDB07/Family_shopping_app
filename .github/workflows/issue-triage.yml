name: Issue triage

on:
  issues:
    types: [opened, labeled, unlabeled]

permissions:
  issues: read
  contents: read
  project: write

jobs:
  route-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to the correct GitHub Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ROADMAP_PROJECT_ID = 'PVT_kwHOBSbHvc4BYxlG';
            const QUALITY_PROJECT_ID = 'PVT_kwHOBSbHvc4BY0nU';

            const featureLabels = new Set(['enhancement']);
            const qualityLabels = new Set(['bug', 'security', 'testing']);

            const issueNumber = context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = issue.labels.map((label) =>
              typeof label === 'string' ? label : label.name,
            );

            const hasFeatureLabel = labels.some((label) => featureLabels.has(label));
            const hasQualityLabel = labels.some((label) => qualityLabels.has(label));

            let targetProjectId = null;
            if (hasQualityLabel) {
              targetProjectId = QUALITY_PROJECT_ID;
            } else if (hasFeatureLabel) {
              targetProjectId = ROADMAP_PROJECT_ID;
            }

            if (!targetProjectId) {
              core.info('No roadmap/quality labels found; skipping project assignment.');
              return;
            }

            const contentId = issue.node_id;

            async function isAlreadyInProject(projectId) {
              const query = `
                query($projectId: ID!, $cursor: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100, after: $cursor) {
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                        nodes {
                          content {
                            ... on Issue {
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              let cursor = null;
              do {
                const result = await github.graphql(query, { projectId, cursor });
                const connection = result.node.items;
                for (const item of connection.nodes) {
                  if (item.content?.number === issueNumber) {
                    return true;
                  }
                }
                cursor = connection.pageInfo.hasNextPage
                  ? connection.pageInfo.endCursor
                  : null;
              } while (cursor);

              return false;
            }

            if (await isAlreadyInProject(targetProjectId)) {
              core.info(`Issue #${issueNumber} is already in the target project.`);
              return;
            }

            await github.graphql(
              `
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item {
                      id
                    }
                  }
                }
              `,
              { projectId: targetProjectId, contentId },
            );

            core.info(`Added issue #${issueNumber} to project ${targetProjectId}.`);
