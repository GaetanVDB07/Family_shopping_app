name: Version bump

on:
  pull_request:
    branches:
      - main

jobs:
  check-version-bump:
    name: Check main release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch base branch
        run: git fetch origin main

      - name: Check package version bump
        run: node scripts/check-main-version-bump.mjs origin/main HEAD
