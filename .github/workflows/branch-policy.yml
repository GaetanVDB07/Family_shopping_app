name: Branch policy

on:
  pull_request:
    branches:
      - develop

jobs:
  check-develop-source-branch:
    name: Check develop source branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ "$HEAD_REF" =~ ^feature/ ]] \
            || [[ "$HEAD_REF" =~ ^fix/ ]] \
            || [[ "$HEAD_REF" =~ ^automation/sync-main- ]]; then
            echo "Allowed source branch for develop: $HEAD_REF"
            exit 0
          fi

          echo "::error::PRs into develop must come from feature/*, fix/*, or automation/sync-main-* branches."
          echo "Create a branch with: git checkout -b feature/your-change  or  npm run fix:start -- your-change"
          exit 1
