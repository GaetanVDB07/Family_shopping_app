name: Keep Supabase alive

on:
  schedule:
    - cron: '8 2 * * *' # Run daily at 02:08 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit production keepalive
        run: |
          curl -sS -f "${{ secrets.PROD_BASE_URL }}/api/cron/keepalive" -o /dev/null || exit 1
      - name: Hit development keepalive (optional)
        run: |
          if [ -n "${{ secrets.DEV_BASE_URL }}" ]; then
            curl -sS -f "${{ secrets.DEV_BASE_URL }}/api/cron/keepalive" -o /dev/null || echo "Dev keepalive failed or not set";
          else
            echo "DEV_BASE_URL not set; skipping dev keepalive";
          fi
